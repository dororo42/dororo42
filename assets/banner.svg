<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Do_rO · 海拉鲁科技研究作坊 兼修左纳乌 · Hyrule Tech Workshop, minor in Zonai engineering">
